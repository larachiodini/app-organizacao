  const list=S.shop.items.filter(i=>tab==='comprados'?i.bought:(!i.bought&&i.kind===tab)).sort((a,b)=>(rank[a.prio]??1)-(rank[b.prio]??1)||a.name.localeCompare(b.name));
  const sum=k=>S.shop.items.filter(i=>!i.bought&&i.kind===k).reduce((s,i)=>s+(Number(i.price)||0),0);
  const cnt=k=>S.shop.items.filter(i=>k==='comprados'?i.bought:(!i.bought&&i.kind===k)).length;
  const cats=[...new Set(list.map(i=>i.cat||'Sem categoria'))];
  return `
  <div class="head"><div><h1>Compras</h1><p>O que você precisa e o que você quer comprar.</p></div>
    <div class="actions"><button class="btn primary" data-act="new-shop">${I.plus}Item detalhado</button></div></div>
  <div class="stats" style="margin-bottom:14px">
    <div class="card"><div class="small muted">Estimado no que preciso</div><div class="big">${brl(sum('preciso'))}</div></div>
    <div class="card"><div class="small muted">Estimado no que quero</div><div class="big">${brl(sum('quero'))}</div></div>
  </div>
  <section class="card" style="--c:var(--shop)">
    <div class="seg" style="margin-bottom:12px">${[['preciso','Preciso'],['quero','Quero'],['comprados','Comprados']].map(([k,l])=>`<button data-act="shop-tab" data-k="${k}" aria-pressed="${tab===k}">${l}<span class="n">${cnt(k)}</span></button>`).join('')}</div>
    ${tab!=='comprados'?adder('shop-'+tab,tab==='preciso'?'Preciso comprar… (ex.: detergente 12,90)':'Quero comprar… (ex.: fone bluetooth 199)','var(--shop)'):''}
    <div style="margin-top:8px">${list.length?cats.map(c=>`<div class="small muted" style="font-weight:600;margin:12px 6px 2px">${esc(c)}</div><ul class="list">${list.filter(i=>(i.cat||'Sem categoria')===c).map(shopRow).join('')}</ul>`).join('')
      :emptyBox(tab==='comprados'?'Os itens marcados como comprados aparecem aqui.':'Lista vazia. Digite acima e aperte Enter.')}</div>
    ${tab==='comprados'&&list.length?`<button class="btn sm" style="margin-top:12px" data-act="clear-bought">Limpar comprados</button>`:''}
  </section>`;
}
function shopForm(i,preset={}){
  const isNew=!i,v={kind:UI.shopTab==='quero'?'quero':'preciso',prio:'media',...preset,...(i||{})};
  const cats=[...new Set(['Mercado','Casa','Roupas','Faculdade','Doceria','Saúde','Eletrônicos',...S.shop.items.map(x=>x.cat).filter(Boolean)])];
  openForm({title:isNew?'Adicionar à lista':'Editar item',hint:preset._ai?'Criado a partir do seu texto. Confira e salve.':'',c:'var(--shop)',fields:[
    {name:'name',label:'Item',type:'text',value:v.name,required:true,placeholder:'Ex.: Fone de ouvido'},
    {name:'kind',label:'Tipo',type:'chips',value:v.kind,options:[['preciso','Preciso'],['quero','Quero']]},
    {name:'prio',label:'Prioridade',type:'chips',value:v.prio,options:[['alta','Urgente','var(--danger)'],['media','Normal'],['baixa','Sem pressa']]},
    {pair:[{name:'price',label:'Preço estimado (R$)',type:'decimal',value:v.price},{name:'cat',label:'Categoria',type:'text',value:v.cat,list:cats}]},
    {name:'link',label:'Link (opcional)',type:'text',value:v.link,placeholder:'https://'},
    {name:'notes',label:'Observações',type:'text',value:v.notes}
  ],onSave:o=>{if(isNew)S.shop.items.push({id:uid(),bought:false,...o});else Object.assign(i,o);save('shop');toast('Lista atualizada')},
  onDelete:isNew?null:()=>withUndo('shop',()=>{S.shop.items=S.shop.items.filter(x=>x.id!==i.id)},'Item excluído')});
}

/* ===== formulário genérico ===== */
function fieldHtml(f){
  if(f.pair)return `<div class="pair">${f.pair.map(fieldHtml).join('')}</div>`;
  const id='f_'+f.name,v=f.value??'';
  let input;
  if(f.type==='chips'){
    const opts=[...f.options];if(f.allowOther&&v&&!opts.some(o=>o[0]===v))opts.push([v,v]);
    input=`<div class="chips" role="radiogroup" aria-label="${esc(f.label)}">${opts.map(([k,l,c])=>`<button type="button" role="radio" data-chip="${esc(k)}" aria-pressed="${String(k)===String(v)}" style="${c?`--c:${c}`:''}">${esc(l)}</button>`).join('')}</div><input type="hidden" id="${id}" name="${f.name}" value="${esc(v)}">${f.allowOther?`<input type="text" class="other" data-other="${f.name}" placeholder="Outro…" style="margin-top:6px" list="${id}_l"><datalist id="${id}_l">${f.options.map(o=>`<option value="${esc(o[0])}">`).join('')}</datalist>`:''}`;
  }else if(f.type==='select')input=`<select id="${id}" name="${f.name}">${f.options.map(([k,l])=>`<option value="${esc(k)}" ${String(k)===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  else if(f.type==='textarea')input=`<textarea id="${id}" name="${f.name}">${esc(v)}</textarea>`;
  else{const val=f.type==='decimal'&&v!==''&&v!==null?fmt(v,2):v;
    input=`<input id="${id}" name="${f.name}" type="${f.type==='decimal'?'text':f.type}" ${f.type==='decimal'?'inputmode="decimal"':''} value="${esc(val)}" ${f.placeholder?`placeholder="${esc(f.placeholder)}"`:''} ${f.list?`list="${id}_l" autocomplete="off"`:''}>${f.list?`<datalist id="${id}_l">${f.list.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`:''}`}
  return `<div class="fld" data-name="${f.name}" ${f.showIf?`data-show="${f.showIf[0]}:${f.showIf[1].join(',')}"`:''}><label ${f.type==='chips'?'':`for="${id}"`}>${esc(f.label)}${f.required?' *':''}</label>${input}</div>`;
}
function openForm({title,hint,c,fields,submit='Salvar',onSave,onDelete,onInput}){
  const dlg=$('#dlg'),flat=fields.flatMap(f=>f.pair||[f]);
  dlg.style.setProperty('--c',c||'var(--brand)');
  dlg.innerHTML=`<div class="dlg-head"><h2>${esc(title)}</h2><button class="icon" data-close aria-label="Fechar">✕</button></div>${hint?`<div class="dlg-hint">${esc(hint)}</div>`:''}
    <div class="dlg-body">${fields.map(fieldHtml).join('')}</div>
    <div class="dlg-foot">${onDelete?'<button class="btn danger" data-del>Excluir</button>':''}<span class="sp"></span><button class="btn" data-close>Cancelar</button><button class="btn primary" data-ok>${esc(submit)}<kbd style="background:transparent;border-color:currentColor;color:inherit;opacity:.7">↵</kbd></button></div>`;
  const vis=()=>{$$('.fld[data-show]',dlg).forEach(el=>{const [n,vals]=el.dataset.show.split(':');const src=$(`.fld[data-name="${n}"]`,dlg);
      el.hidden=!(src&&!src.hidden&&vals.split(',').includes($('#f_'+n,dlg).value))});
    $$('.pair',dlg).forEach(p=>p.style.display=$$('.fld',p).every(f=>f.hidden)?'none':'')};
  vis();
  dlg.oninput=e=>{
    if(e.target.dataset.other){const n=e.target.dataset.other,h=$('#f_'+n,dlg);h.value=e.target.value.trim();$$(`.fld[data-name="${n}"] [data-chip]`,dlg).forEach(b=>b.setAttribute('aria-pressed',b.dataset.chip===h.value))}
    vis();if(onInput&&e.target.name)onInput(e.target.name,e.target,dlg)};
  dlg.onchange=vis;
  const submitFn=()=>{
    const out={};let bad=null;
    for(const f of flat){
      const wrap=$(`.fld[data-name="${f.name}"]`,dlg);wrap.classList.remove('err');
      if(wrap.hidden){out[f.name]=f.type==='decimal'?null:'';continue}
      const el=$('#f_'+f.name,dlg);let v=el.value.trim();
      if(f.type==='decimal'){v=v===''?null:parseNum(v);if(v!==null&&isNaN(v)){wrap.classList.add('err');bad=bad||el;continue}}
      if(f.required&&(v===''||v===null)){wrap.classList.add('err');bad=bad||el;continue}
      out[f.name]=v;
    }
    if(bad){bad.focus();return}
    dlg.close();onSave(out);render();
  };
  dlg.onclick=e=>{
    const chip=e.target.closest('[data-chip]');
    if(chip){const fld=chip.closest('.fld');$$('[data-chip]',fld).forEach(b=>b.setAttribute('aria-pressed',b===chip));$('#f_'+fld.dataset.name,dlg).value=chip.dataset.chip;const o=$('.other',fld);if(o)o.value='';
      const c2=chip.style.getPropertyValue('--c');if(fld.dataset.name==='biz'&&c2)dlg.style.setProperty('--c',c2);vis();return}
    if(e.target===dlg||e.target.closest('[data-close]'))dlg.close();
    else if(e.target.closest('[data-ok]'))submitFn();
    else if(e.target.closest('[data-del]')){dlg.close();onDelete()}
  };
  dlg.onkeydown=e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&!(e.target.list&&false)){e.preventDefault();submitFn()}};
  dlg.showModal();
  setTimeout(()=>{const first=$('input:not([type=hidden]):not(.other),textarea',dlg);first&&first.focus()},40);
}

/* ===== Paleta de comandos ===== */
const P={q:'',sel:0,items:[],busy:false};
function openPalette(){
  const pal=$('#pal');
  pal.innerHTML=`<div class="pal-in">${I.search}<input id="palq" placeholder="O que você quer fazer? Ex.: dentista amanhã 15h" autocomplete="off" aria-label="Buscar ou criar"><kbd>Esc</kbd></div><ul class="pal-res" id="palres" role="listbox"></ul>
    <div class="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> navegar</span><span><kbd>↵</kbd> escolher</span>${ai?`<span>${I.spark.replace('<svg','<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"')} escreva uma frase e a IA preenche para você</span>`:''}</div>`;
  P.q='';P.sel=0;P.busy=false;
  pal.showModal();
  const q=$('#palq');q.focus();
  q.oninput=()=>{P.q=q.value;P.sel=0;palUpdate()};
  q.onkeydown=e=>{
    if(e.key==='ArrowDown'){e.preventDefault();P.sel=Math.min(P.items.length-1,P.sel+1);palPaint()}
    else if(e.key==='ArrowUp'){e.preventDefault();P.sel=Math.max(0,P.sel-1);palPaint()}
    else if(e.key==='Enter'){e.preventDefault();palRun(P.sel)}
  };
  pal.onclick=e=>{if(e.target===pal){pal.close();return}const li=e.target.closest('[data-i]');if(li)palRun(+li.dataset.i)};
  palUpdate();
}
function palActions(){
  const a=(label,ic,c,run,kw='')=>({label,ic,c,run,kw,group:'Criar'});
  const list=[
    a('Novo evento','agenda','var(--evento)',()=>itemForm(null,{kind:'evento'}),'aniversario festa encerramento'),
    a('Nova atividade','agenda','var(--atividade)',()=>itemForm(null,{kind:'atividade'}),'aula faculdade trabalho rotina'),
    a('Nova tarefa da agenda','check','var(--tarefa)',()=>itemForm(null,{kind:'tarefa'}),'lembrete entregar prazo'),
    a('Registrar peso','scale','var(--fit)',()=>weightForm(),'balanca kg'),
    a('Registrar treino','flame','var(--fit)',()=>workoutForm(todayISO()),'academia exercicio'),
    a('Adicionar refeição','food','var(--fit)',()=>mealForm(todayISO()),'comida caloria proteina dieta'),
    ...S.money.goals.map(g=>a(`Guardar dinheiro em ${g.name}`,'coin','var(--money)',()=>entryForm(g,1),'poupar depositar')),
    a('Nova meta de dinheiro','coin','var(--money)',()=>goalForm(),'poupanca objetivo'),
    a('Tarefa da empresa','brief','var(--work)',()=>taskForm(null,{biz:'empresa'}),'trabalho'),
    a('Tarefa da doceria','cake','var(--sweet)',()=>taskForm(null,{biz:'doceria'}),'encomenda bolo doce'),
    a('Adicionar à lista de compras','compras','var(--shop)',()=>shopForm(),'comprar mercado'),
    ...VIEWS.map(v=>({label:`Ir para ${v.label}`,ic:v.id,c:v.c,run:()=>{location.hash=v.id},kw:'abrir pagina',group:'Navegar'})),
    ...(user?[{label:'Sair da conta',ic:'go',c:'var(--muted)',run:logout,kw:'logout deslogar',group:'Navegar'}]:[]),
    {label:'Alternar tema claro/escuro',ic:'spark',c:'var(--muted)',run:toggleTheme,kw:'dark modo noturno',group:'Navegar'}
  ];
  return list;
}
function palUpdate(){
  const q=norm(P.q.trim()),words=q.split(/\s+/).filter(Boolean);
  let items=palActions().filter(x=>!words.length||words.every(w=>norm(x.label+' '+x.kw).includes(w)));
  if(!words.length)items=items.filter(x=>x.group==='Criar').slice(0,8).concat(items.filter(x=>x.group==='Navegar').slice(0,6));
  const found=[];
  if(q.length>=2){
    const m=s=>norm(s).includes(q);
    S.agenda.items.filter(i=>m(i.title)).slice(0,4).forEach(i=>found.push({label:i.title,sub:`${KINDS[i.kind].label}, ${relDate(i.date)}`,ic:i.kind==='tarefa'?'check':'agenda',c:KINDS[i.kind].c,run:()=>itemForm(i),group:'Encontrado'}));
    S.work.tasks.filter(i=>m(i.title)).slice(0,4).forEach(i=>found.push({label:i.title,sub:BIZ[i.biz].label,ic:i.biz==='doceria'?'cake':'brief',c:BIZ[i.biz].c,run:()=>taskForm(i),group:'Encontrado'}));
    S.shop.items.filter(i=>m(i.name)).slice(0,3).forEach(i=>found.push({label:i.name,sub:i.bought?'comprado':i.kind,ic:'compras',c:'var(--shop)',run:()=>shopForm(i),group:'Encontrado'}));
  }
  const aiItem=ai&&P.q.trim().length>=4?[{label:P.q.trim(),sub:'criar com IA',ic:'spark',ai:true,run:()=>aiCreate(P.q.trim()),group:'IA'}]:[];
  const strong=items.length>0&&words.length>0;
  P.items=strong?[...items,...found,...aiItem]:[...aiItem,...found,...items];
  palPaint();
}
function palPaint(){
  const res=$('#palres');if(!res)return;
  if(P.busy){res.innerHTML=`<li style="display:flex;gap:10px;align-items:center;padding:14px 12px;color:var(--muted)"><div class="spin"></div>Entendendo o que você escreveu…</li>`;return}
  if(!P.items.length){res.innerHTML=`<li class="muted" style="padding:14px 12px">Nada encontrado.${ai?'':' Tente outra palavra.'}</li>`;return}
  let html='',g=null;
  P.items.forEach((x,i)=>{if(x.group!==g){g=x.group;html+=`<li class="pal-grp" role="presentation">${g==='IA'?'Criar com IA':g}</li>`}
    html+=`<li role="option" data-i="${i}" aria-selected="${i===P.sel}" style="--c:${x.c||'var(--brand)'}"><span class="ic ${x.ai?'ai-ic':''}">${I[x.ic]||I.go}</span><span class="lb">${x.ai?'“'+esc(x.label)+'”':esc(x.label)}${x.sub?`<small>${esc(x.sub)}</small>`:''}</span><span class="go">↵</span></li>`});
  res.innerHTML=html;
  const s=$('[aria-selected="true"]',res);s&&s.scrollIntoView({block:'nearest'});
}
function palRun(i){
  const x=P.items[i];if(!x||P.busy)return;
  if(x.ai){x.run();return}
  $('#pal').close();x.run();
}
async function aiCreate(text){
  P.busy=true;palPaint();
  const t=todayISO();
  const prompt=`Você transforma um pedido curto, em português do Brasil, em UMA ação para um app pessoal de organização.
Hoje é ${longDate(t)}, ${t}. Datas relativas (amanhã, sexta, dia 5) devem virar AAAA-MM-DD a partir de hoje; se o dia já passou neste mês, use o próximo.
Metas de dinheiro existentes: ${JSON.stringify(S.money.goals.map(g=>g.name))}.
Responda somente com um objeto JSON, sem markdown, no formato {"type": "...", "data": {...}}.
Tipos possíveis:
- "agenda": {"title","kind":"evento"|"atividade"|"tarefa","date","time":"HH:MM" ou "","cat","repeat":"none"|"daily"|"weekly"|"yearly"}. Aniversário = evento com repeat "yearly". Aula ou compromisso fixo semanal = atividade com repeat "weekly". Algo a entregar, pagar ou lembrar = tarefa.
- "work": tarefa de trabalho {"title","biz":"empresa"|"doceria","prio":"alta"|"media"|"baixa","due":"AAAA-MM-DD" ou "","client","value":número ou null}. Encomendas de doces, bolos, brigadeiros e afins são "doceria"; demais tarefas profissionais são "empresa".
- "shop": {"name","kind":"preciso"|"quero","price":número ou null,"cat","prio":"alta"|"media"|"baixa"}
- "weight": {"kg":número,"date"}
- "workout": {"type","date","min":número ou null,"notes"}
- "meal": {"name","meal":"Café da manhã"|"Almoço"|"Lanche"|"Jantar"|"Outro","kcal":estimativa numérica,"prot":gramas estimadas,"date"}
- "money": {"goal":nome exato de uma meta existente,"amount":número (negativo se for retirada),"date","note"}
- "none": quando não for possível entender; data {}.
Pedido: ${JSON.stringify(text)}`;
  try{
    const r=await ai.json(prompt,{modelTier:'quick',cache:false});
    P.busy=false;$('#pal').close();
    dispatchAI(r||{});
  }catch(e){
    P.busy=false;
    if(e&&e.code==='not_granted'){ai=null;toast('A IA foi desativada para esta página')}
    else if(e&&e.code==='rate_limited')toast('Muitos pedidos seguidos. Tente em instantes.');
    else toast('Não consegui entender. Tente escrever de outro jeito.');
    palUpdate();
  }
}
function dispatchAI(r){
  const d=(r&&typeof r.data==='object'&&r.data)||{},s=x=>typeof x==='string'?x.slice(0,200):'';
  const date=isDate(d.date)?d.date:todayISO();
  const pick=(v,ok,def)=>ok.includes(v)?v:def;
  switch(r.type){
    case 'agenda':itemForm(null,{_ai:1,title:s(d.title),kind:pick(d.kind,['evento','atividade','tarefa'],'atividade'),date,time:isTime(d.time)?d.time:'',cat:s(d.cat),repeat:pick(d.repeat,['none','daily','weekly','monthly','yearly'],'none')});break;
    case 'work':taskForm(null,{_ai:1,title:s(d.title),biz:pick(d.biz,['empresa','doceria'],'empresa'),prio:pick(d.prio,['alta','media','baixa'],'media'),due:isDate(d.due)?d.due:'',client:s(d.client),value:finite(d.value)});break;
    case 'shop':shopForm(null,{_ai:1,name:s(d.name),kind:pick(d.kind,['preciso','quero'],'preciso'),price:finite(d.price),cat:s(d.cat),prio:pick(d.prio,['alta','media','baixa'],'media')});break;
    case 'weight':weightForm({_ai:1,kg:finite(d.kg),date});break;
    case 'workout':workoutForm(date,{_ai:1,type:s(d.type)||'Treino',date,min:finite(d.min),notes:s(d.notes)});break;
    case 'meal':mealForm(date,null,{_ai:1,name:s(d.name),meal:pick(d.meal,['Café da manhã','Almoço','Lanche','Jantar','Outro'],'Outro'),kcal:finite(d.kcal),prot:finite(d.prot),date});break;
    case 'money':{const g=S.money.goals.find(g=>norm(g.name)===norm(d.goal))||(S.money.goals.length===1?S.money.goals[0]:null);
      if(!g){toast(S.money.goals.length?'Não identifiquei a meta. Escolha em Dinheiro.':'Crie uma meta de dinheiro primeiro.');if(!S.money.goals.length)goalForm();break}
      const amt=finite(d.amount)||0;entryForm(g,amt<0?-1:1,{_ai:1,amount:amt,date,note:s(d.note)});break}
    default:toast('Não consegui entender. Tente ser mais específico.');
  }
}

/* ===== interações ===== */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a||a.closest('dialog'))return;
  const {act,id}=a.dataset,item=()=>S.agenda.items.find(x=>x.id===id);
  switch(act){
    case 'palette':openPalette();break;
    case 'login':doAuth('login');break;
    case 'signup':doAuth('signup');break;
    case 'magic':doAuth('magic');break;
    case 'logout':logout();break;
    case 'theme':toggleTheme();break;
    case 'new-item':itemForm(null,{date:a.dataset.date});break;
    case 'edit-item':itemForm(item());break;
    case 'toggle-item':{const it=item();it.done=!it.done;save('agenda');render();if(it.done)toast('Tarefa concluída ✓',()=>{it.done=false;save('agenda');render()});break}
    case 'goto-day':UI.sel=a.dataset.date;UI.month=null;location.hash='agenda';break;
    case 'sel-day':UI.sel=a.dataset.date;{const d=parse(UI.sel);if(d.getMonth()!==UI.month.getMonth()||d.getFullYear()!==UI.month.getFullYear())UI.month=new Date(d.getFullYear(),d.getMonth(),1)}render();break;
    case 'month':{const d=+a.dataset.d;if(d===0){UI.sel=todayISO();UI.month=null}else UI.month=new Date(UI.month.getFullYear(),UI.month.getMonth()+d,1);render();break}
    case 'filter':UI.filter=a.dataset.k;render();break;
    case 'new-goal':goalForm();break;
    case 'edit-goal':goalForm(S.money.goals.find(g=>g.id===id));break;
    case 'add-entry':entryForm(S.money.goals.find(g=>g.id===id),+a.dataset.sign);break;
    case 'toggle-goal':UI.openGoal=UI.openGoal===id?null:id;render();break;
    case 'del-entry':withUndo('money',()=>{const g=S.money.goals.find(g=>g.id===id);g.entries=g.entries.filter(x=>x.id!==a.dataset.e)},'Lançamento excluído');break;
    case 'fit-settings':fitSettings();break;
    case 'new-weight':weightForm();break;
    case 'del-weight':withUndo('fitness',()=>{S.fitness.weights=S.fitness.weights.filter(w=>w.id!==id)},'Registro excluído');break;
    case 'new-workout':workoutForm(a.dataset.date);break;
    case 'del-workout':withUndo('fitness',()=>{S.fitness.workouts=S.fitness.workouts.filter(w=>w.id!==id)},'Treino excluído');break;
    case 'meal-day':{const n=addDays(UI.mealDate,+a.dataset.d);if(n<=todayISO()){UI.mealDate=n;render()}break}
    case 'new-meal':mealForm(a.dataset.date);break;
    case 'edit-meal':mealForm(UI.mealDate,(S.meals.days[UI.mealDate]||[]).find(m=>m.id===id));break;
    case 'del-meal':delMeal(id);break;
    case 'biz':UI.biz=a.dataset.k;render();break;
    case 'new-task':taskForm();break;
    case 'edit-task':taskForm(S.work.tasks.find(t=>t.id===id));break;
    case 'move-task':{const t=S.work.tasks.find(t=>t.id===id);const i=STATUS.findIndex(s=>s[0]===t.status);moveTask(id,STATUS[Math.max(0,Math.min(2,i+ +a.dataset.d))][0]);break}
    case 'clear-done':withUndo('work',()=>{S.work.tasks=S.work.tasks.filter(t=>!(t.biz===UI.biz&&t.status==='done'))},'Concluídas removidas');break;
    case 'shop-tab':UI.shopTab=a.dataset.k;render();break;
    case 'new-shop':shopForm();break;
    case 'edit-shop':shopForm(S.shop.items.find(i=>i.id===id));break;
    case 'toggle-shop':{const i=S.shop.items.find(i=>i.id===id);i.bought=!i.bought;save('shop');render();if(i.bought)toast('Marcado como comprado',()=>{i.bought=false;save('shop');render()});break}
    case 'clear-bought':withUndo('shop',()=>{S.shop.items=S.shop.items.filter(i=>!i.bought)},'Comprados removidos');break;
  }
});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.change==='diet'){S.fitness.diet=e.target.value;save('fitness');toast('Plano de dieta salvo')}});

/* adicionar rápido com Enter */
function quickShop(text){const m=text.match(/^(.*?)(?:\s+R?\$?\s*(\d+(?:[.,]\d{1,2})?))?$/i);const name=(m&&m[1]||text).trim();const price=m&&m[2]?parseNum(m[2]):null;return {name:name||text,price:Number.isFinite(price)?price:null}}
document.addEventListener('keydown',e=>{
  const el=e.target;
  if(el.classList&&el.classList.contains('inline-add')&&e.key==='Enter'){
    e.preventDefault();const v=el.value.trim(),k=el.dataset.add;if(!v)return;
    if(k==='task-today'||k==='task-sel'){S.agenda.items.push({id:uid(),title:v,kind:'tarefa',date:k==='task-today'?todayISO():UI.sel,time:'',cat:'',repeat:'none',done:false});save('agenda')}
    else if(k.startsWith('work-')){S.work.tasks.push({id:uid(),title:v,biz:UI.biz,status:k.slice(5),prio:'media',due:''});save('work')}
    else if(k.startsWith('shop-')){const q=quickShop(v);S.shop.items.push({id:uid(),bought:false,name:q.name,price:q.price,kind:k.slice(5),prio:'media',cat:''});save('shop')}
    render();const again=$(`input.inline-add[data-add="${k}"]`);again&&again.focus();
    return;
  }
  if(el.dataset&&el.dataset.login!==undefined&&e.key==='Enter'){e.preventDefault();doAuth('login');return}
  if(authView==='login'||!ready)return;
  if(document.querySelector('dialog[open]'))return;
  const typing=/INPUT|TEXTAREA|SELECT/.test(el.tagName)||el.isContentEditable;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return}
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='/'||e.key.toLowerCase()==='n'){e.preventDefault();openPalette()}
  else if(/^[1-6]$/.test(e.key)){location.hash=VIEWS[+e.key-1].id}
});

/* arrastar e soltar no quadro */
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-drag]');if(!c)return;dragId=c.dataset.drag;c.classList.add('dragging');try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'}catch(_){}});
document.addEventListener('dragend',()=>{dragId=null;$$('.dragging,.over').forEach(x=>x.classList.remove('dragging','over'))});
document.addEventListener('dragover',e=>{const col=e.target.closest&&e.target.closest('[data-drop]');if(!col||!dragId)return;e.preventDefault();$$('.col.over').forEach(x=>x!==col&&x.classList.remove('over'));col.classList.add('over')});
document.addEventListener('drop',e=>{const col=e.target.closest&&e.target.closest('[data-drop]');if(!col||!dragId)return;e.preventDefault();const id=dragId;dragId=null;moveTask(id,col.dataset.drop)});

$('#dlg').addEventListener('close',()=>setTimeout(()=>{if(needRender)softRender()},30));
$('#pal').addEventListener('close',()=>setTimeout(()=>{if(needRender)softRender()},30));
render();
boot();
</script>
</body>
</html>
